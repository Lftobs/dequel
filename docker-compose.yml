services:
    buildkit:
        image: moby/buildkit:latest
        restart: unless-stopped
        command:
            [
                "--addr",
                "tcp://0.0.0.0:1234",
                "--root",
                "/var/lib/buildkit",
            ]
        privileged: true
        volumes:
            - buildkit-data:/var/lib/buildkit
        networks:
            dequel:
                aliases:
                    - buildkit
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q -T 2 -O /dev/null http://localhost:1234 >/dev/null 2>&1; [ $$? -ne 4 ]",
                ]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s

    api:
        image: ghcr.io/lftobs/dequel/api:next
        # build:
        #     context: ./apps/api
        #     dockerfile: Dockerfile
        restart: unless-stopped
        environment:
            PORT: 3001
            DATABASE_URL: postgresql://${POSTGRES_USER:-dequel}:${POSTGRES_PASSWORD:-dequel}@postgres:5432/${POSTGRES_DB:-dequel}
            WORKSPACE_ROOT: /app/workspace
            CADDY_ROUTES_DIR: /caddy/routes
            CADDY_BASE_DOMAIN: ${CADDY_BASE_DOMAIN:-localhost}
            DOCKER_NETWORK: dequel_net
            APP_INTERNAL_PORT: 3000
            BUILDKIT_HOST: tcp://buildkit:1234
            DOCKER_BIN: /usr/bin/docker
            RAILPACK_VERBOSE: "1"
            RAILPACK_BUILD_TIMEOUT_MS: "1200000"
            GRAFANA_URL: http://grafana:3000/grafana
        volumes:
            - ./workspace:/app/workspace
            - ./infra/caddy/routes:/caddy/routes
            - /var/run/docker.sock:/var/run/docker.sock
            - railpack-cache:/tmp/railpack
            - api-data:/app/data
            - /etc/passwd:/etc/passwd:ro
            - /etc/group:/etc/group:ro
        depends_on:
            buildkit:
                condition: service_started
                required: false
            postgres:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "-fsS",
                    "http://localhost:3001/api/health",
                ]
            interval: 50s
            timeout: 3s
            retries: 100
            start_period: 10s
        networks:
            dequel:
                aliases:
                    - api

    pam-auth:
        image: python:3-slim
        restart: unless-stopped
        entrypoint: []
        command:
            - sh
            - -c
            - |
                apt-get update -qq > /dev/null 2>&1 && apt-get install -y -qq libpam-modules > /dev/null 2>&1 && cp /app/dequel /etc/pam.d/dequel && exec python3 -u /app/pam-server.py
        volumes:
            - ./scripts/auth/pam-server.py:/app/pam-server.py:ro
            - ./scripts/auth/dequel:/app/dequel:ro
            - /etc/passwd:/etc/passwd:ro
            - /etc/shadow:/etc/shadow:ro
            - /etc/group:/etc/group:ro
        networks:
            dequel:
                aliases:
                    - pam-auth
        healthcheck:
            test:
                [
                    "CMD",
                    "python3",
                    "-c",
                    "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:4567/health').status == 200 else 1)",
                ]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 10s

    web:
        image: ghcr.io/lftobs/dequel/web:next
        # build:
        #     context: ./apps/web
        #     args:
        #         DEQUEL_VERSION: ${DEQUEL_VERSION:-}
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "-e",
                    "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
                ]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 30s
        networks:
            dequel:
                aliases:
                    - web

    caddy:
        image: caddy:2.8-alpine
        restart: unless-stopped
        command:
            [
                "caddy",
                "run",
                "--config",
                "/etc/caddy/Caddyfile",
                "--adapter",
                "caddyfile",
                "--watch",
            ]
        environment:
            CADDY_EMAIL: ${CADDY_EMAIL:-admin@dequel.local}
            CADDY_BASE_DOMAIN: ${CADDY_BASE_DOMAIN:-localhost}
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - ./infra/caddy/routes:/etc/caddy/routes
        depends_on:
            api:
                condition: service_healthy
            web:
                condition: service_healthy
        networks:
            dequel:

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        networks:
            dequel:
                aliases:
                    - redis
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-dequel}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dequel}
            POSTGRES_DB: ${POSTGRES_DB:-dequel}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            dequel:
                aliases:
                    - postgres
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U dequel"]
            interval: 5s
            timeout: 3s
            retries: 5

    cadvisor:
        profiles: ["monitoring"]
        image: gcr.io/cadvisor/cadvisor:latest
        restart: unless-stopped
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro
        privileged: true
        devices:
            - /dev/kmsg
        networks:
            dequel:
                aliases:
                    - cadvisor
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://localhost:8080/metrics",
                ]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 5s

    prometheus:
        profiles: ["monitoring"]
        image: prom/prometheus:latest
        restart: unless-stopped
        stop_grace_period: 60s
        entrypoint: []
        command:
            - sh
            - /entrypoint.sh
        volumes:
            - ./infra/monitoring/prometheus-entrypoint.sh:/entrypoint.sh:ro
            - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus-data:/prometheus
        depends_on:
            cadvisor:
                condition: service_started
        networks:
            dequel:
                aliases:
                    - prometheus
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://localhost:9090/-/ready",
                ]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 5s

    loki:
        profiles: ["monitoring"]
        image: grafana/loki:3.0.0
        restart: unless-stopped
        command:
            - -config.file=/etc/loki/loki-config.yml
        volumes:
            - ./infra/monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
            - loki-data:/loki
        networks:
            dequel:
                aliases:
                    - loki
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://localhost:3100/ready",
                ]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 10s

    promtail:
        profiles: ["monitoring"]
        image: grafana/promtail:3.0.0
        restart: unless-stopped
        command:
            - -config.file=/etc/promtail/promtail-config.yml
        volumes:
            - ./infra/monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
            - /var/run/docker.sock:/var/run/docker.sock
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - promtail-data:/data
        depends_on:
            loki:
                condition: service_started
        networks:
            dequel:

    grafana:
        profiles: ["monitoring"]
        image: grafana/grafana:latest
        restart: unless-stopped
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
            GF_SERVER_ROOT_URL: http://localhost/grafana
            GF_SERVER_SERVE_FROM_SUB_PATH: "true"
            GF_INSTALL_PLUGINS: ""
        volumes:
            - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
            - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
            - grafana-data:/var/lib/grafana
        depends_on:
            prometheus:
                condition: service_started
            loki:
                condition: service_started
        networks:
            dequel:
                aliases:
                    - grafana
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://localhost:3000/api/health",
                ]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 15s

networks:
    dequel:
        name: dequel_net

volumes:
    buildkit-data:
    redis-data:
    postgres-data:
    api-data:
    prometheus-data:
    loki-data:
    grafana-data:
    railpack-cache:
    promtail-data:
